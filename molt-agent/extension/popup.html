<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Molt Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 240px;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .logo .olt { color: #F5B740; text-shadow: 0 0 10px rgba(245,183,64,0.6); }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .tagline {
      margin-top: 12px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="logo">M<span class="olt">olt</span></div>
  <div class="status">
    <div class="dot"></div>
    Agent active — watching for students
  </div>
  <p class="tagline">AI responds to discussion posts and questions while students are still in session.</p>
</body>
</html>
